map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Enterprise Load Balancer Upstream Pool (Least Connections with Keepalive)
upstream gateway_cluster {
    least_conn;
    server gateway:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SafeScholar Go Gateway API & WebSockets Load Balanced Proxy
    location /api/ {
        proxy_pass http://gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Gateway Health Check Proxy
    location /healthz {
        proxy_pass http://gateway_cluster/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # React Router SPA handling
    location / {
        try_files $uri $uri/ /index.html;
    }
}
